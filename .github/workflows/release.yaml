name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: write

env:
  CHARTS_REPOSITORY_PATH: charts.undistro.io
  CHART_PATH: charts/zora
  COMMIT_MESSAGE: "chore(chart): sync Zora Helm chart"

jobs:
  docker:
    uses: ./.github/workflows/docker.yaml
    secrets: inherit

  goreleaser:
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: fetch tags
        run: git fetch --force --tags

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    runs-on: ubuntu-latest
    needs: [goreleaser]
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: main

      - name: generate charts app token
        id: charts-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CHARTS_APP_ID }}
          private-key: ${{ secrets.CHARTS_APP_PRIVATE_KEY }}
          owner: undistro
          repositories: helm-charts

      - name: checkout charts
        uses: actions/checkout@v7
        with:
          repository: undistro/helm-charts
          ref: main
          fetch-depth: 1
          token: ${{ steps.charts-app-token.outputs.token }}
          path: ${{ env.CHARTS_REPOSITORY_PATH }}

      - name: sync
        run: rsync -avh --delete main/$CHART_PATH/ ${{ env.CHARTS_REPOSITORY_PATH }}/$CHART_PATH

      - name: commit and push
        working-directory: ${{ env.CHARTS_REPOSITORY_PATH }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHART_PATH"
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE for $RELEASE_TAG"
          git push origin HEAD:main
